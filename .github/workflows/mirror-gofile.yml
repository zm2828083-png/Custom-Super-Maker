name: Mirror existing GoFile build

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing GoFile archive
        env:
          SHARE_ID: mj5HVlRX
          TARGET_NAME: super_repack_38092128263.tar
        run: |
          python3 - <<'PY'
          import os, json, time, hashlib, tarfile, sys
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode

          UA = "Mozilla/5.0"
          SHARE = os.environ["SHARE_ID"]
          NAME = os.environ["TARGET_NAME"]
          OUT = "/tmp/" + NAME

          def website_token(account_token):
              slot = int(time.time()) // 14400
              raw = f"{UA}::en-US::{account_token}::{slot}::12af056dacea0b"
              return hashlib.sha256(raw.encode()).hexdigest()

          common = {
              "User-Agent": UA,
              "Accept": "*/*",
              "Origin": "https://gofile.io",
              "Referer": "https://gofile.io/"
          }

          def get_json(url, extra=None, method="GET"):
              headers = dict(common)
              headers.update(extra or {})
              data = b"" if method == "POST" else None
              req = Request(url, data=data, headers=headers, method=method)
              with urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          print("Creating temporary GoFile guest session...")
          account = get_json(
              "https://api.gofile.io/accounts",
              {
                  "X-Website-Token": website_token(""),
                  "X-BL": "en-US"
              },
              "POST"
          )
          if account.get("status") != "ok":
              raise RuntimeError("GoFile account request failed: " + str(account))

          token = account["data"]["token"]
          wt = website_token(token)
          query = urlencode({
              "cache": "true",
              "sortField": "createTime",
              "sortDirection": "1"
          })

          print("Looking up the existing archive...")
          meta = get_json(
              f"https://api.gofile.io/contents/{SHARE}?{query}",
              {
                  "Authorization": "Bearer " + token,
                  "Cookie": "accountToken=" + token,
                  "X-Website-Token": wt,
                  "X-BL": "en-US"
              }
          )
          if meta.get("status") != "ok":
              raise RuntimeError("GoFile metadata request failed: " + str(meta))

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          matches = [
              x for x in walk(meta.get("data", {}))
              if x.get("name") == NAME
              and x.get("type") == "file"
              and (x.get("link") or x.get("directLink"))
          ]
          if not matches:
              names = sorted({
                  x.get("name", "") for x in walk(meta.get("data", {}))
                  if x.get("type") == "file"
              })
              raise RuntimeError("Target file not found. Files listed: " + repr(names))

          item = matches[0]
          link = item.get("link") or item.get("directLink")
          expected = int(item.get("size") or 0)

          print(f"Downloading {NAME}; expected bytes: {expected}")
          req = Request(link, headers={
              "User-Agent": UA,
              "Accept": "*/*",
              "Referer": f"https://gofile.io/d/{SHARE}",
              "Cookie": "accountToken=" + token
          })

          downloaded = 0
          with urlopen(req, timeout=180) as response, open(OUT, "wb") as dest:
              while True:
                  block = response.read(1024 * 1024)
                  if not block:
                      break
                  dest.write(block)
                  downloaded += len(block)
                  if downloaded % (100 * 1024 * 1024) < len(block):
                      print(f"Downloaded {downloaded / (1024**3):.2f} GiB")

          if expected and downloaded != expected:
              raise RuntimeError(
                  f"Size mismatch: expected {expected}, got {downloaded}"
              )

          print("Checking TAR archive...")
          with tarfile.open(OUT, "r:") as archive:
              names = archive.getnames()
              if not any(n == "super.img" or n.endswith("/super.img") for n in names):
                  raise RuntimeError("super.img missing from the TAR archive")
              print("Archive contents:", names)

          digest = hashlib.sha256()
          with open(OUT, "rb") as f:
              for block in iter(lambda: f.read(4 * 1024 * 1024), b""):
                  digest.update(block)

          print("Download and archive validation successful.")
          print("Size:", downloaded)
          print("SHA256:", digest.hexdigest())
          PY

      - name: Upload archive to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: super-repack-38092128263
          path: /tmp/super_repack_38092128263.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
